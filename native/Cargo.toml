[package]
name = "minecolonies"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MineColonies for Horizon: a colony you found, build and staff on the native hook points."

# The same file the bundle adds to the game as crate::game::minecolonies.
[lib]
path = "mixins/minecolonies/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
