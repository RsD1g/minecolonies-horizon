[mod]
id = "minecolonies"
version = "0.1.0"
priority = 100

# Hook points only. The launcher builds this on a Horizon whose native hook
# API is at least the version in compatibility.json, and otherwise on the
# pinned revision.
[compatibility]
horizon_revision = "c98a51a664c8ce8ec166ecedd85bb47b3687b336"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "minecolonies"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

